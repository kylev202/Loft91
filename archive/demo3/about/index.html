<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D0C0A" />
    <title>About us — Loft 91</title>
    <meta
      name="description"
      content="Loft 91 is a bar and function space upstairs at 91 Nicholson Street, Footscray. Hours, the address, and how to find the entrance."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="About us — Loft 91" />
    <meta
      property="og:description"
      content="Upstairs, 91 Nicholson Street, Footscray — the stairs are beside the deli."
    />
    <meta property="og:image" content="/img/entrance-1600.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <link rel="apple-touch-icon" href="/img/favicon-180.png" />

    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/img/entrance-800.avif 800w, /img/entrance-1600.avif 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <link rel="preload" href="/fonts/Switzer-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Zodiak-Regular.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      (function () {
        var skip = false;
        try {
          skip = sessionStorage.getItem('l91-loaded') === '1';
        } catch (e) {
          skip = false;
        }
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) skip = true;
        if (skip) document.documentElement.setAttribute('data-loader', 'skip');
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/about.tsx"></script>
  </body>
</html>
